# GitHub, herkese açık depolarda 60 gün hiç değişiklik olmazsa zamanlanmış görevleri durdurur.
# Bu görev ayda bir küçük bir kayıt ekleyerek taramanın durmasını önler.

name: Canlı tut

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  canli-tut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Küçük bir kayıt ekle
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .canli-tut
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .canli-tut
          git commit -m "Canlı tut"
          git push
