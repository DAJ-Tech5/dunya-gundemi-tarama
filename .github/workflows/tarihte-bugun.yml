# Tarihte bugün: Türkçe Vikipedi'nin olay listesi (bugün ve sonraki iki gün). Türkiye saatiyle gece yarısından hemen sonra.
# Gerekli gizli değerler: TARAMA_ADRESI, TARAMA_ANAHTARI

name: Tarihte bugün

on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tarihte-bugun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Olayları oku ve gönder
        run: node tarama/tarihte-bugun.ts
        env:
          TARAMA_ADRESI: ${{ secrets.TARAMA_ADRESI }}
          TARAMA_ANAHTARI: ${{ secrets.TARAMA_ANAHTARI }}
